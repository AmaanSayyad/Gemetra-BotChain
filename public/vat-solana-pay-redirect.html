<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening payment…</title>
</head>
<body>
  <p style="font-family: system-ui; padding: 1rem; color: #444">Opening payment…</p>
  <script>
    (function () {
      var raw = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";
      if (raw.indexOf("solana:") === 0) {
        location.replace(raw);
      } else {
        document.body.textContent = "Invalid or missing payment link.";
      }
    })();
  </script>
</body>
</html>
